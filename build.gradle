plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}

// Os arquivos temporários do build ficam FORA da pasta do projeto (o OneDrive
// trava essas pastas e o build falha). Local: %LOCALAPPDATA%\AbyssSub-build
def outBase = new File(System.getenv('LOCALAPPDATA') ?: System.getProperty('java.io.tmpdir'), 'AbyssSub-build')
allprojects {
    layout.buildDirectory.set(new File(outBase, project.name))
}
