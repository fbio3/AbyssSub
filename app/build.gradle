plugins {
    id 'com.android.application'
}

// Login com Google / nuvem: só liga se o google-services.json do Firebase estiver na pasta app/.
// Sem ele o app compila normalmente e funciona no modo "sem conta".
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// No GitHub Actions a chave vem do segredo ABYSS_DEBUG_KEYSTORE (a mesma chave de debug do seu PC),
// para o APK do GitHub ter a mesma assinatura registrada no Firebase.
def ciKeystore = System.getenv('ABYSS_KEYSTORE_FILE')

android {
    namespace 'com.abysssub.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.abysssub.app'
        minSdk 24
        targetSdk 34
        versionCode 9
        versionName '1.7'
        manifestPlaceholders = [appLabel: '@string/app_name']
    }

    signingConfigs {
        ci {
            if (ciKeystore) {
                storeFile file(ciKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (ciKeystore) signingConfig signingConfigs.ci
        }
        release {
            minifyEnabled false
            // Usa a chave de debug para o APK release já sair instalável.
            signingConfig ciKeystore ? signingConfigs.ci : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.13.1'
}

// Depois de gerar, copia o APK para a pasta "APK" do projeto.
def apkDestino = rootProject.file('APK')
def pastaBuild = layout.buildDirectory
['Debug', 'Release'].each { variante ->
    tasks.matching { it.name == "assemble${variante}" }.configureEach { t ->
        t.doLast {
            def origem = pastaBuild.dir("outputs/apk/${variante.toLowerCase()}").get().asFile
            apkDestino.mkdirs()
            origem.listFiles()?.findAll { it.name.endsWith('.apk') }?.each { f ->
                java.nio.file.Files.copy(f.toPath(),
                    new File(apkDestino, f.name.replace('app-', 'AbyssSub-')).toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}
