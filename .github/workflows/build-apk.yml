name: Gerar APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # o padrão da action instala o pacote "tools", que não existe mais
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (a mesma do seu PC)
        env:
          KEYSTORE_B64: ${{ secrets.ABYSS_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/abyss.keystore"
            echo "ABYSS_KEYSTORE_FILE=$RUNNER_TEMP/abyss.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo ABYSS_DEBUG_KEYSTORE não configurado: o APK sai com uma chave temporária e o login com Google não funciona nele."
          fi

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AbyssSub-apk
          path: APK/*.apk

      - name: Publicar na página de Releases (quando for uma tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: APK/*.apk
          generate_release_notes: true
