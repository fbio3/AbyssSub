name: Gerar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  release:
    types: [ published ]   # ao publicar uma Release pelo site, o APK é anexado nela

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # o padrão da action instala o pacote "tools", que não existe mais
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Chave de assinatura (a mesma do seu PC)
        env:
          KEYSTORE_B64: ${{ secrets.ABYSS_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/abyss.keystore"
            echo "ABYSS_KEYSTORE_FILE=$RUNNER_TEMP/abyss.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Segredo ABYSS_DEBUG_KEYSTORE não configurado: o APK sai com uma chave temporária e o login com Google não funciona nele."
          fi

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          APK=$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi
          cp "$APK" AbyssSub.apk
          ls -l AbyssSub.apk

      - name: Guardar APK (aba Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AbyssSub
          path: AbyssSub.apk
          if-no-files-found: error

      - name: Anexar o APK na Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: AbyssSub.apk
          fail_on_unmatched_files: true
